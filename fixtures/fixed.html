<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlindSpot fixed fixture</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: Arial, sans-serif; color: #172033; }
    .shell { max-width: 900px; width: 100%; box-sizing: border-box; padding: 24px; margin: auto; }
    .clip { max-width: 100%; overflow-wrap: anywhere; }
    .error-indicator { width: 24px; height: 24px; background: #b42318; }
    .ticker { animation: slide 2s linear infinite; }
    button, input { min-height: 44px; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(40px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header><h1>Sign in</h1></header>
    <main>
      <h2>Account details</h2>
      <p class="clip">Enter your email address and password to continue.</p>
      <img src="/decorative.png" alt="">
      <form aria-describedby="instructions">
        <p id="instructions">Both fields are required.</p>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button type="submit">Sign in</button>
        <button type="button">Need help?</button>
      </form>
      <div class="error-indicator" aria-label="Account status: ready" role="img"></div>
      <div class="ticker">New account activity</div>
    </main>
  </div>
</body>
</html>
